<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WMS Layer Visual Harness</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { createApp, h } from 'vue'
      import { createPinia } from 'pinia'
      import LayerControl from '/src/modules/planning/panels/LayerControl.vue'
      import MapArea from '/src/modules/planning/components/MapArea.vue'
      import { useAppStore } from '/src/stores/app.ts'
      import { useDictionaryStore } from '/src/stores/dictionary.ts'
      import { useLayerStore } from '/src/stores/layer.ts'
      import '/src/style.css'

      const pinia = createPinia()
      const appStore = useAppStore(pinia)
      const dictionaryStore = useDictionaryStore(pinia)
      const layerStore = useLayerStore(pinia)

      const definitions = [
        ['elevation', 'BATHY', '海洋高程', 'cable:OceanElevation'],
        ['coldCoral', 'CWCORAL', '冷水珊瑚', 'cable:WCMC008_CoralReef2021_Py_v4_1'],
        ['fishing', 'FISHZONE', '海洋渔区分布', 'cable:fishing_area_NoDuplicate_Classify_two_level'],
        ['earthquake', 'SEISMIC', '地震活动', 'cable:earthQuakeData'],
        ['shipping', 'SHIPLANE', '航道分布', 'cable:Ship_area_Classify_two_level'],
        ['volcano', 'VOLCANO', '火山区域', 'cable:volcane_location'],
      ]

      appStore.setCurrentProject({
        id: 'wms-visual-project',
        name: 'GeoServer WMS visual verification',
        type: 'route-planning',
        platformProjectId: 'wms-visual-project',
      })
      dictionaryStore.itemsByType = {
        LAYER_TYPE: definitions.map(([, code, name], index) => ({
          id: String(index + 1),
          code,
          name,
          type: 'LAYER_TYPE',
          sortNum: index + 1,
          isValidCd: '1',
        })),
      }
      dictionaryStore.loadedByType = { LAYER_TYPE: true }
      layerStore.platformProjectLayers = definitions.map(([, code, name, wmsLayerName], index) => ({
        id: String(index + 1),
        name,
        typeDic: code,
        geoLayerName: wmsLayerName,
        isDefault: 1,
      }))
      layerStore.platformDefaultLayers = [...layerStore.platformProjectLayers]
      layerStore.loadPlatformDefaultLayers = async () => {}
      layerStore.loadPlatformProjectLayers = async () => {}

      definitions.forEach(([id, code, name, wmsLayerName], index) => {
        layerStore.upsertLayer({
          id,
          name,
          type: id === 'elevation' ? 'raster' : 'vector',
          visible: id === 'elevation',
          loaded: true,
          loading: false,
          opacity: id === 'elevation' ? 0.72 : 1,
          zIndex: 80 + index,
        })
        layerStore.setLayerData(id, {
          id,
          metadata: {
            source: `platform:${index + 1}::${wmsLayerName}`,
            typeDic: code,
            wmsUrl: '/geoserver/geo/wms',
            wmsLayerName,
          },
        })
      })

      const Harness = {
        setup: () => () => h('div', {
          class: 'flex h-screen min-h-0 gap-2 overflow-hidden bg-gray-100 p-2',
        }, [
          h('aside', { class: 'flex min-h-0 w-80 shrink-0' }, [h(LayerControl)]),
          h('main', { class: 'flex min-h-0 min-w-0 flex-1' }, [h(MapArea)]),
        ]),
      }

      createApp(Harness).use(pinia).mount('#app')
    </script>
  </body>
</html>
